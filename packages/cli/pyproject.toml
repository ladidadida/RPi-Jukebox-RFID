[project]
name = "jukebox-cli"
version = "0.1.0"
description = "Jukebox CLI"
requires-python = ">=3.11"
dependencies = [
  "typer",
  "websockets",
  "jukebox",
]

[tool.uv]
package = true

[tool.uv.sources]
jukebox = { workspace = true }

[project.scripts]
jukebox = "jukebox_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukebox_cli"]
