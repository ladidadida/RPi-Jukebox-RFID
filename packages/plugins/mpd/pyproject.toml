[project]
name = "jukebox-plugin-mpd"
version = "1.0.0"
description = "Jukebox plugin: player backend using an external MPD server"
requires-python = ">=3.11"
dependencies = [
  "jukebox",
  "python-mpd2",
]

[project.entry-points."jukebox.plugins"]
mpd = "jukebox_plugin_mpd:Mpd"

[tool.uv.sources]
jukebox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukebox_plugin_mpd"]
