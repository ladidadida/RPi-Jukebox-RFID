[project]
name = "rpi-jukebox-rfid"
# Not sourced from src/jukebox/jukebox/version.py yet -- real packaging (installable wheel,
# version sourcing) is Track B in documentation/developers/roadmap-core-architecture.md, not this
# tooling migration.
version = "3.7.0"
description = "RFID-controlled audio jukebox for the Raspberry Pi (fork)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "evdev",
  "mutagen",
  "pulsectl",
  "python-mpd2",
  "ruamel.yaml",
  "requests",
  "fastapi",
  "uvicorn",
  "websockets",  # run_publicity_sniffer.py: a plain WebSocket client for /api/v1/events
  "gpiozero",
  # RPi.GPIO shim for kernels >= 6.6 (Trixie), where /sys/class/gpio/ is gone. Only meaningful on
  # real Pi hardware; harmless to attempt elsewhere since uv will just skip it if unresolvable.
  # Originally installed with `pip install rpi-lgpio --no-binary=lgpio`; uv's equivalent
  # (`uv sync --no-binary-package rpi-lgpio` or `[tool.uv] no-binary-package`) is not yet verified
  # against real Pi hardware -- flagged as a known gap, not solved here.
  "rpi-lgpio; platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "coverage",
  "mock",
  "httpx",  # for starlette.testclient (FastAPI API server tests)
  "ruff>=0.6",
  "pyright>=1.1",
  "pydoc-markdown",
  "bam-tool",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--maxfail=2 -rf --ff -v --import-mode=importlib"
testpaths = ["test"]

[tool.coverage.run]
omit = ["test/*"]

[tool.pydoc-markdown]
loaders = [{ type = "python", search_path = ["./src/jukebox"] }]
processors = [{ type = "filter" }, { type = "sphinx" }, { type = "crossref" }]

[tool.pydoc-markdown.renderer]
type = "markdown"
render_toc = true
filename = "./documentation/developers/docstring/README.md"
render_page_title = true

[tool.ruff]
line-length = 127
target-version = "py311"
extend-exclude = [
  "scratch*",
  "*/jukebox/NvManager.py",  # not ported/linted yet, matches the old flake8 exclusion
  "**/node_modules",
]

[tool.ruff.lint]
# Mirrors the previous flake8 rule set (E, F, W, C90/mccabe) as closely as possible rather than
# also turning on isort ("I") / pyupgrade ("UP"): this codebase has never been run through either,
# and doing so here would create an unrelated few-thousand-line formatting backlog. Follow-up
# decision, not done in this pass.
select = ["E", "F", "W", "C90"]
# E126/E127/E128 (continuation line indent), W503 (line break before binary operator), and F824
# (unused global/nonlocal) were ignored under flake8 but aren't implemented by ruff at all
# (unknown-rule error if listed) -- nothing to ignore for them here.

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src/jukebox"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/scratch*",
  ".venv",
  "src/jukebox/jukebox/NvManager.py",
]
