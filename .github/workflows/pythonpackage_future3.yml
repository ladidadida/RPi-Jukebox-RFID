name: Python + Docs Checks and Tests

on:
  # Version 3 branches inherit this workflow, so their names are unrestricted.
  push:
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - 'pyproject.toml'
        - 'uv.lock'
        - 'bam.yaml'
        - '.coveragerc'
        - '**.py'
  pull_request:
    branches:
        - 'future3/**'
    paths:
        - '.github/workflows/pythonpackage_future3.yml'
        - 'pyproject.toml'
        - 'uv.lock'
        - 'bam.yaml'
        - '.coveragerc'
        - '**.py'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libczmq-dev pulseaudio

        uv sync --group dev
        # Also install all optional rfid-hardware dependencies (not part of the base project,
        # each hardware backend has its own requirements.txt)
        uv pip install -r src/jukebox/components/rfid/hardware/fake_reader_gui/requirements.txt
        uv pip install -r src/jukebox/components/rfid/hardware/pn532_i2c_py532/requirements.txt
        uv pip install -r src/jukebox/components/rfid/hardware/rdm6300_serial/requirements.txt
        uv pip install -r src/jukebox/components/rfid/hardware/rc522_spi/requirements.txt
    - name: Run pytest with coverage
      run: |
        uv run pytest --cov --cov-report xml --cov-config=.coveragerc
    - name: Report to Coveralls (parallel)
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml
        format: cobertura
        parallel: true
    - name: Lint with ruff
      run: |
        # Stop the build if linting fails
        uv run bam lint

  finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
