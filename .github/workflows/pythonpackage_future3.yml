name: Python Checks and Tests

on:
  push:
    paths: &python-paths
      - '.github/workflows/pythonpackage_future3.yml'
      - '**/pyproject.toml'
      - 'uv.lock'
      - 'bam.yaml'
      - '**.py'
      - '**/interfaces/*.json'
  pull_request:
    paths: *python-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint with ruff
        run: uv run bam lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (bookworm), Debian trixie, newest.
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libpulse0
      - name: Install dependencies
        # Core and bundled plugins (workspace members). Tests needing a reader driver's
        # dependency skip without it.
        run: uv sync --locked --group dev
      - name: Run pytest with coverage
        run: uv run pytest --cov --cov-report xml
      - name: Report to Coveralls (parallel)
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          flag-name: python-${{ matrix.python-version }}
          parallel: true
          fail-on-error: false

  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false
